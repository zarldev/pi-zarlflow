name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps or command transcript.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Pi version, OS, package version, install source.
